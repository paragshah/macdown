<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  <!-- Inline SVG favicon (reuses the brand mark) so no external request is made -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%234b6bfb' d='M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.69C0 12.48.52 13 1.15 13h13.69c.64 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3zM9 11H7V8L5.5 9.92 4 8v3H2V5h2l1.5 2L7 5h2v6zm2.99.5L9.5 8H11V5h2v3h1.5l-2.51 3.5z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <!-- Markdown + syntax highlighting (bundled locally so the app works offline) -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 16 16" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.69C0 12.48.52 13 1.15 13h13.69c.64 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3zM9 11H7V8L5.5 9.92 4 8v3H2V5h2l1.5 2L7 5h2v6zm2.99.5L9.5 8H11V5h2v3h1.5l-2.51 3.5z"/>
        </svg>
        <span class="brand__name">Markdown Viewer</span>
      </div>
      <div class="topbar__actions">
        <button id="sampleBtn" class="btn btn--ghost" type="button">Load sample</button>
        <button id="newBtn" class="btn btn--ghost" type="button" hidden>Open another</button>
        <button id="themeToggle" class="btn btn--icon" type="button" aria-label="Toggle theme" title="Toggle light/dark">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 17a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4.22 5.64a1 1 0 011.42 0l1.41 1.41A1 1 0 115.64 8.46L4.22 7.05a1 1 0 010-1.41zm12.72 12.72a1 1 0 011.41 0l1.41 1.41a1 1 0 01-1.41 1.41l-1.41-1.41a1 1 0 010-1.41zM2 12a1 1 0 011-1h2a1 1 0 110 2H3a1 1 0 01-1-1zm17 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM5.64 15.54a1 1 0 010 1.41l-1.41 1.41a1 1 0 01-1.41-1.41l1.41-1.41a1 1 0 011.41 0zM18.36 2.82a1 1 0 010 1.41L16.95 5.64a1 1 0 11-1.41-1.41l1.41-1.41a1 1 0 011.41 0z"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.64 13a1 1 0 00-1.05-.14 8 8 0 01-3.37.73 8.15 8.15 0 01-8.14-8.1 8.59 8.59 0 01.25-2A1 1 0 008 2.36 10.14 10.14 0 1022 14.05a1 1 0 00-.36-1.05z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Drop zone / uploader (shown until a file is loaded) -->
    <section id="dropzone" class="dropzone" tabindex="0" aria-label="Upload a markdown file">
      <div class="dropzone__inner">
        <svg class="dropzone__icon" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
          <path fill="currentColor" d="M19 13a1 1 0 00-1 1v3.28a1 1 0 01-1 1H7a1 1 0 01-1-1V14a1 1 0 00-2 0v3.28A3 3 0 007 20.28h10a3 3 0 003-3V14a1 1 0 00-1-1zM8.71 8.71L11 6.41V14a1 1 0 002 0V6.41l2.29 2.3a1 1 0 001.42-1.42l-4-4a1 1 0 00-1.42 0l-4 4a1 1 0 101.42 1.42z"/>
        </svg>
        <h1 class="dropzone__title">Drop a Markdown file here</h1>
        <p class="dropzone__hint">or click to browse. Supports <code>.md</code>, <code>.markdown</code>, <code>.mdown</code>, <code>.txt</code></p>
        <button id="browseBtn" class="btn btn--primary" type="button">Choose file</button>
        <input id="fileInput" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
      </div>
    </section>

    <!-- Rendered output -->
    <article id="output" class="markdown-body" hidden></article>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay__card">
      <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path fill="currentColor" d="M19 13a1 1 0 00-1 1v3.28a1 1 0 01-1 1H7a1 1 0 01-1-1V14a1 1 0 00-2 0v3.28A3 3 0 007 20.28h10a3 3 0 003-3V14a1 1 0 00-1-1zM8.71 8.71L11 6.41V14a1 1 0 002 0V6.41l2.29 2.3a1 1 0 001.42-1.42l-4-4a1 1 0 00-1.42 0l-4 4a1 1 0 101.42 1.42z"/></svg>
      <p>Drop to render</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
